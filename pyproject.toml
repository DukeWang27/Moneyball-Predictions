[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moneyball-predictions"
version = "0.12.2"
description = "MLB sabermetric predictions and Polymarket paper-trading research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "numpy>=1.26,<3.0",
  "pydantic>=2.8,<3.0",
  "scikit-learn>=1.5,<2.0",
  "scipy>=1.13,<2.0",
  "rapidfuzz>=3.9,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
trading = [
  "py-clob-client-v2>=1.0.2,<2.0",
]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moneyball_predictions = ["static/*.html", "static/*.css", "static/*.js", "static/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
